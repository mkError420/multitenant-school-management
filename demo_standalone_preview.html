                          <p className="text-xs text-emerald-600 font-bold">Class 6 to 12</p>
                        </div>
                        <div className="p-5 bg-white dark:bg-slate-900 rounded-2xl border">
                          <p className="text-[10px] uppercase font-bold text-slate-400">Attendance Today</p>
                          <h3 className="text-2xl font-black text-emerald-600 mt-1">94.8%</h3>
                          <p className="text-xs text-slate-400">1,185 Present • 65 Absent</p>
                        </div>
                        <div className="p-5 bg-white dark:bg-slate-900 rounded-2xl border">
                          <p className="text-[10px] uppercase font-bold text-slate-400">Fees Collected (March)</p>
                          <h3 className="text-2xl font-black text-indigo-600 mt-1">৳ 485,000</h3>
                          <p className="text-xs text-rose-500 font-bold">Due: ৳ 65,000</p>
                        </div>
                        <div className="p-5 bg-white dark:bg-slate-900 rounded-2xl border">
                          <p className="text-[10px] uppercase font-bold text-slate-400">SMS Credits</p>
                          <h3 className="text-2xl font-black text-purple-600 mt-1">{currentTenant.sms_balance}</h3>
                          <p className="text-xs text-slate-400">GreenwebBD Masking</p>
                        </div>
                      </div>
                    </div>
                  )}

                  {activeTab === 'students' && (
                    <div className="bg-white dark:bg-slate-900 border rounded-2xl p-6 shadow-sm space-y-4">
                      <h3 className="font-extrabold text-sm">Students Directory & ID Card Generation</h3>
                      <table className="w-full text-xs text-left">
                        <thead className="bg-slate-50 dark:bg-slate-800 uppercase text-[10px] font-bold border-b">
                          <tr>
                            <th className="p-3">Roll</th>
                            <th className="p-3">Student Name</th>
                            <th className="p-3">Guardian & Phone</th>
                            <th className="p-3">Blood</th>
                            <th className="p-3">Fee Status</th>
                            <th className="p-3 text-right">Actions</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y font-medium">
                          {students.map(s => (
                            <tr key={s.id}>
                              <td className="p-3 font-extrabold text-sm">{s.roll_no}</td>
                              <td className="p-3 font-bold">{s.name_en} <span className="text-emerald-600 block text-[10px] font-bengali">{s.name_bn}</span></td>
                              <td className="p-3">{s.father_name} • <span className="font-mono text-emerald-600">{s.father_phone}</span></td>
                              <td className="p-3 font-bold text-rose-600">{s.blood_group}</td>
                              <td className="p-3"><span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[10px] font-bold uppercase">{s.fee_status}</span></td>
                              <td className="p-3 text-right">
                                <button onClick={() => setSelectedStudentForID(s)} className="px-3 py-1 bg-emerald-50 text-emerald-700 font-bold rounded-lg">
                                  🪪 ID Card
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}

                  {activeTab === 'exams' && (
                    <div className="bg-white dark:bg-slate-900 border rounded-2xl p-6 shadow-sm space-y-4">
                      <div className="flex justify-between items-center pb-3 border-b">
                        <h3 className="font-extrabold text-sm">Bangladesh NCTB GPA 5.0 Tabulation Matrix (Class 10)</h3>
                        <button onClick={() => window.print()} className="px-3 py-1.5 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow">🖨️ Print Tabulation</button>
                      </div>
                      <table className="w-full text-xs text-center border">
                        <thead>
                          <tr className="bg-slate-100 dark:bg-slate-800 font-bold">
                            <th className="p-2 border">Roll</th>
                            <th className="p-2 border text-left">Student Name</th>
                            <th className="p-2 border">Bangla (100)</th>
                            <th className="p-2 border">Math (100)</th>
                            <th className="p-2 border">Physics (100)</th>
                            <th className="p-2 border bg-amber-50 dark:bg-amber-950">Higher Math [4th]</th>
                            <th className="p-2 border bg-emerald-50 dark:bg-emerald-950">GPA 5.0</th>
                            <th className="p-2 border bg-emerald-50 dark:bg-emerald-950">Grade</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y font-semibold">
                          <tr>
                            <td className="p-2 border font-bold">01</td>
                            <td className="p-2 border text-left font-bold">Tanvir Hasan</td>
                            <td className="p-2 border">88 (A+)</td>
                            <td className="p-2 border">92 (A+)</td>
                            <td className="p-2 border">91 (A+)</td>
                            <td className="p-2 border bg-amber-50 dark:bg-amber-950">92 (+3.00 Bonus)</td>
                            <td className="p-2 border font-black text-emerald-600 text-sm">5.00</td>
                            <td className="p-2 border font-bold text-emerald-600">A+ Golden</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  )}

                  {activeTab === 'fees' && (
                    <div className="bg-white dark:bg-slate-900 border rounded-2xl p-6 shadow-sm space-y-4">
                      <h3 className="font-extrabold text-sm">Fees POS Counter & 3-Part Money Receipts</h3>
                      <table className="w-full text-xs text-left">
                        <thead className="bg-slate-50 dark:bg-slate-800 font-bold uppercase text-[10px] border-b">
                          <tr>
                            <th className="p-3">Invoice #</th>
                            <th className="p-3">Student Name</th>
                            <th className="p-3">Total</th>
                            <th className="p-3">Paid</th>
                            <th className="p-3">Due</th>
                            <th className="p-3">Status</th>
                            <th className="p-3 text-right">Voucher</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y font-medium">
                          {invoices.map(inv => (
                            <tr key={inv.id}>
                              <td className="p-3 font-mono font-bold">{inv.invoice_no}</td>
                              <td className="p-3 font-bold">{inv.student_name}</td>
                              <td className="p-3 font-bold">৳{inv.total}</td>
                              <td className="p-3 text-emerald-600 font-bold">৳{inv.paid}</td>
                              <td className="p-3 text-rose-600 font-bold">৳{inv.due}</td>
                              <td className="p-3"><span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[10px] font-bold uppercase">{inv.status}</span></td>
                              <td className="p-3 text-right">
                                <button onClick={() => setSelectedInvoiceForReceipt(inv)} className="px-3 py-1 bg-slate-100 dark:bg-slate-800 font-bold rounded-lg">
                                  🖨️ 3-Part Slip
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </>
              )}
            </main>
          </div>

          {/* Onboard School Modal for Super Admin */}
          {isSaAddModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 max-w-md w-full space-y-4 text-xs">
                <h3 className="font-extrabold text-sm">🏢 Onboard New Institution (SaaS)</h3>
                <form onSubmit={handleAddTenant} className="space-y-3">
                  <div>
                    <label className="font-bold block mb-1">School Full Name *</label>
                    <input required placeholder="e.g. Rajshahi Model College" value={newTenant.name} onChange={e => setNewTenant({...newTenant, name: e.target.value})} className="w-full p-2 border rounded-xl bg-slate-50 dark:bg-slate-800" />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">EIIN Number *</label>
                    <input required placeholder="e.g. 102938" value={newTenant.eiin} onChange={e => setNewTenant({...newTenant, eiin: e.target.value})} className="w-full p-2 border rounded-xl bg-slate-50 dark:bg-slate-800 font-mono" />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Subdomain *</label>
                    <input required placeholder="e.g. rajshahimodel" value={newTenant.subdomain} onChange={e => setNewTenant({...newTenant, subdomain: e.target.value})} className="w-full p-2 border rounded-xl bg-slate-50 dark:bg-slate-800" />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Education Board</label>
                    <select value={newTenant.board} onChange={e => setNewTenant({...newTenant, board: e.target.value})} className="w-full p-2 border rounded-xl bg-slate-50 dark:bg-slate-800">
                      <option>Dhaka</option>
                      <option>Chittagong</option>
                      <option>Rajshahi</option>
                      <option>Jessore</option>
                      <option>Comilla</option>
                      <option>Sylhet</option>
                    </select>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsSaAddModalOpen(false)} className="px-3 py-1.5 bg-slate-200 rounded-xl font-bold">Cancel</button>
                    <button type="submit" className="px-4 py-1.5 bg-emerald-600 text-white font-bold rounded-xl shadow">Confirm Onboard</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Printable ID Card Modal */}
          {selectedStudentForID && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full space-y-4 text-center">
                <h3 className="font-bold text-sm no-print">🪪 Student ID Card</h3>
                <div className="w-56 h-80 bg-white text-slate-900 border-2 border-emerald-600 rounded-xl mx-auto p-3 flex flex-col justify-between shadow-lg">
                  <div className="bg-emerald-700 text-white py-1 rounded text-[10px] font-bold uppercase">{currentTenant.name}</div>
                  <div>
                    <img src={selectedStudentForID.photo_url} className="w-16 h-16 rounded-full mx-auto object-cover ring-2 ring-emerald-500 mb-1" />
                    <h4 className="font-bold text-xs">{selectedStudentForID.name_en}</h4>
                    <p className="text-[10px] text-emerald-700 font-bengali">{selectedStudentForID.name_bn}</p>
                    <p className="text-[9px] text-slate-500 mt-1">Roll: <strong>{selectedStudentForID.roll_no}</strong> • {selectedStudentForID.class_name}</p>
                    <p className="text-[9px] text-rose-600 font-bold">Blood: {selectedStudentForID.blood_group}</p>
                  </div>
                  <div className="bg-emerald-800 text-white text-[8px] py-0.5 rounded font-mono font-bold">{selectedStudentForID.admission_no}</div>
                </div>
                <div className="flex justify-center gap-2 no-print">
                  <button onClick={() => window.print()} className="px-4 py-1.5 bg-emerald-600 text-white font-bold rounded-xl text-xs">Print</button>
                  <button onClick={() => setSelectedStudentForID(null)} className="px-4 py-1.5 bg-slate-200 font-bold rounded-xl text-xs">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* 3-Part Receipt Modal */}
          {selectedInvoiceForReceipt && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm overflow-y-auto">
              <div className="bg-white text-slate-900 rounded-2xl p-6 max-w-2xl w-full space-y-4 text-xs">
                <div className="no-print flex justify-between items-center pb-2 border-b">
                  <h3 className="font-bold text-sm">💳 3-Part Money Receipt Voucher</h3>
                  <div className="flex gap-2">
                    <button onClick={() => window.print()} className="px-3 py-1 bg-emerald-600 text-white font-bold rounded-lg">Print</button>
                    <button onClick={() => setSelectedInvoiceForReceipt(null)} className="px-3 py-1 bg-slate-200 font-bold rounded-lg">Close</button>
                  </div>
                </div>
                <div className="space-y-3">
                  {['Student Copy', 'School Copy', 'Bank Copy'].map((copy, idx) => (
                    <div key={idx} className="border border-slate-300 p-3 rounded-xl bg-slate-50 space-y-1">
                      <div className="flex justify-between border-b pb-1">
                        <span className="font-bold">{currentTenant.name}</span>
                        <span className="font-bold text-emerald-700 uppercase">{copy}</span>
                      </div>
                      <div className="flex justify-between py-1">
                        <span>Student: <strong>{selectedInvoiceForReceipt.student_name} (Roll {selectedInvoiceForReceipt.roll})</strong></span>
                        <span className="font-bold text-emerald-700">Paid: ৳{selectedInvoiceForReceipt.paid}</span>
                      </div>
                      <div className="text-[10px] text-slate-400 flex justify-between">
                        <span>{selectedInvoiceForReceipt.invoice_no} • {selectedInvoiceForReceipt.method}</span>
                        <span>Authorized Signatory</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
